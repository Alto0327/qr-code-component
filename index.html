<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      text-align: center;
      font-family: 'outfit';
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;    
      flex-direction: column;
      background-color: #d5e1ef;
    }
    
    .main-container{
      margin: auto;
      width: 70%;
      max-width: 480px;
      background-color: hsl(0, 0%, 100%);
      padding: 20px 16px 40px 16px;
      border-radius: 22px;     
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .qrCode{
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    h1 {
      font-weight: 700;
      margin: 0 0 12px 0;
    }

    h2 {
      font-weight: 400;
      color: hsl(220, 15%, 55%);
      margin: 0;
    }



    @media (max-width: 375px) {
      h1 {
        font-size: 1.4rem;
      }
      h2 {
        font-size: 1rem;
      }

    }
    
  </style>
</head>
<body>
  <main class="main-container">
    <img src="./images/image-qr-code.png" alt="image-qr-code" class="qrCode">
    <h1>
      Improve your front-end <br> skills by building projects
    </h1>
    <h2>
      Scan the QR code to visit Frontend <br>Mentor and take your coding skills to <br>the next level
    </h2>
  </main>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Alto0327">Aldo Fonseca</a>.
  </div>
</body>
</html>
